name: tick

# Turns "confirmed, past due, never marked done" into "missed", with an audit row.
#
# Deliberately not on a tight schedule: overdue is computed when the record is
# read, so a late or missed tick never makes the interface wrong — it only delays
# the durable "missed" fact.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the scheduled job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "APP_URL or CRON_SECRET is not configured; skipping."
            exit 0
          fi
          status=$(curl -s -o /tmp/tick.json -w '%{http_code}' \
            -X POST "${APP_URL}/api/jobs/tick" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 60)
          echo "HTTP ${status}"
          cat /tmp/tick.json
          echo
          test "${status}" = "200"
